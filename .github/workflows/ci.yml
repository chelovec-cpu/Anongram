name: AnonGram CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AnonGram/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: AnonGram/backend/go.sum

      - run: gofmt -w *.go
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o anongram-api .

      - uses: actions/upload-artifact@v4
        with:
          name: anongram-api
          path: AnonGram/backend/anongram-api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AnonGram/web

    steps:
      - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: anongram-web
          path: AnonGram/web/dist

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - run: gradle :app:assembleDebug --stacktrace
        working-directory: AnonGram/android

      - uses: actions/upload-artifact@v4
        with:
          name: anongram-android-debug
          path: AnonGram/android/app/build/outputs/apk/debug/app-debug.apk
